<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>research-app — tests</title>
<style>
  body { font-family: "Segoe UI", sans-serif; background: #101418; color: #e8eef0; padding: 24px 32px; }
  h1 { font-size: 1.2rem; }
  .summary { font-weight: 700; font-size: 1.05rem; }
  .summary.all-pass { color: #4fd1c5; }
  .summary.some-fail { color: #e0736a; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; font-size: 0.9rem; }
  li.pass { color: #4fd1c5; }
  li.fail { color: #e0736a; background: rgba(224, 115, 106, 0.12); }
</style>
</head>
<body>
  <h1>research-app — storage.js tests</h1>
  <div id="results"></div>
  <script src="storage.js"></script>
  <script src="test.js"></script>
</body>
</html>
